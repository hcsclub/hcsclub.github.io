title: 화천시니어클럽
description: 화천군 노인일자리 전담기관 화천시니어클럽 공식 홈페이지
url: "https://hclub.kr"

markdown: kramdown

# 사이트맵(sitemap.xml)과 RSS 피드(feed.xml)를 자동으로 만들어주는 플러그인입니다.
# 둘 다 깃허브 페이지에서 정식으로 지원하는 플러그인이라 별도 설치 없이 이 두 줄만으로 작동합니다.
plugins:
  - jekyll-sitemap
  - jekyll-feed

# 공지사항용 폴더(_notices)를 사용하겠다고 지킬에게 알려주는 설정입니다.
# output: false → 공지사항 하나하나가 별도 페이지 주소를 갖지 않고,
# 목록 페이지 안에서 팝업(모달)으로만 보여지도록 합니다.
collections:
  notices:
    output: false

# _posts 폴더의 글은 별도로 layout이나 주소 형식을 적지 않아도
# 자동으로 post 레이아웃(헤더/푸터 포함) + /news/연도/월/일/제목/ 형식의 주소를 사용합니다.
# (다른 일반 페이지(about.html 등)에는 영향을 주지 않도록, 여기서 posts에만 한정해 지정합니다.)
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      permalink: /news/:year/:month/:day/:title/

# 소식(뉴스) 목록 페이지 한 페이지당 카드 개수 (가로 2 x 세로 3)
posts_per_page: 6

# 지킬이 그대로 복사하지 않아도 되는 파일/폴더
exclude:
  - README.md
