<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} | {% endif %}화천시니어클럽</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}화천시니어클럽">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="website">
<meta property="og:image" content="/images/{{ page.og_image | default: 'hero-illustration.jpg' }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
<link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>
  <div class="nav-row">
    <a href="/index.html" class="brand"><img src="/images/logo.png" alt="화천시니어클럽 로고">화천<span>시니어클럽</span></a>
    <button class="nav-toggle" id="navToggle" aria-label="메뉴 열기" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav aria-label="주 메뉴">
      <ul>
        <li><a href="/about.html"{% if page.nav == 'about' %} aria-current="page"{% endif %}>기관소개</a></li>
        <li><a href="/programs.html"{% if page.nav == 'programs' %} aria-current="page"{% endif %}>사업안내</a></li>
        <li><a href="/join.html"{% if page.nav == 'join' %} aria-current="page"{% endif %}>참여안내</a></li>
        <li><a href="/news.html"{% if page.nav == 'news' %} aria-current="page"{% endif %}>소식</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
{{ content }}
</main>

<footer>
  <div class="wrap foot-row">
    <div>© 2026 화천시니어클럽. All rights reserved.</div>
    <div class="foot-links">
      <a href="/about.html#notice">이용의 한계와 법적고지</a>
      <a href="/about.html">이용안내</a>
      <a href="/join.html#contact">문의하기</a>
    </div>
  </div>
</footer>

<script src="/js/main.js" defer></script>
</body>
</html>
